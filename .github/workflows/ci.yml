name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No browser and no build: it reads the token blocks out of global.css
      # and measures them, so it runs in under a second and cannot be skipped
      # for being slow. It is first for that reason.
      - name: Colour tokens clear AA in both themes
        run: node scripts/check-contrast.mjs

      - name: Type-check and build
        run: npm run build

      - name: Check internal links in the built site
        run: node scripts/check-links.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist
          retention-days: 7

  external-links:
    name: External link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --accept 200,204,301,302,403,429
            --exclude-mail
            --exclude "localhost|127.0.0.1|example.com|twitter.com|x.com|linkedin.com|facebook.com|instagram.com|t.me|wa.me|play.google.com|apps.apple.com"
            --timeout 30 --max-retries 2
            "**/*.md"
          fail: false
